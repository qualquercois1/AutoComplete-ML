<a href="?selecionado=$palavra" target="_self" class="card-link">
    <div class="card-podio" style="
        background: $cor_fundo; 
        color: $cor_texto;
        height: ${altura}px; 
        margin-top: ${margin_top}px;
        opacity: $opacidade_inicial;
        animation: $animacao_card;
    ">
        <div style="opacity: $opacidade_inicial; animation: $animacao_texto;">
            <div class="card-rank">$rankº Lugar</div>
            <div class="card-palavra" style="font-size: ${tamanho_fonte}px;">$palavra</div>
            <div class="card-prob">Probabilidade: $prob</div>
        </div>
    </div>
</a>
